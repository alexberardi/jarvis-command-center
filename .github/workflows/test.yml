name: Test Suite (SQLite Only)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Create data directory
      run: mkdir -p data
    
    - name: Run SQLite tests
      env:
        DB_TYPE: sqlite
        DB_URL: sqlite:///./data/test.db
      run: |
        python -m pytest tests/ -v \
          --ignore=tests/test_llm_integration.py \
          --ignore=tests/test_postgres_integration.py \
          -k "not llm" \
          --tb=short \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing

    - name: Run database configuration tests
      env:
        DB_TYPE: sqlite
        DB_URL: "sqlite:///:memory:"
      run: |
        python -m pytest tests/test_database_config.py -v \
          --tb=short \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
