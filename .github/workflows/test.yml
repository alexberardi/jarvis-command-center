name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        # Install core dependencies (excluding local packages like jarvis_auth_client)
        pip install fastapi uvicorn sqlalchemy alembic pydantic httpx python-dotenv rapidfuzz
        pip install git+https://github.com/alexberardi/jarvis-settings-client.git@main

    - name: Run settings tests
      run: |
        # Run settings tests which don't depend on full app context
        python -m pytest tests/test_settings.py -v --tb=short

    - name: Run tool routing tests
      run: |
        # Run tool routing tests that don't require jarvis_auth_client
        python -m pytest tests/test_tool_routing.py -v --tb=short || echo "Some tests may fail without full deps"

    - name: Run date resolution tests
      run: |
        python -m pytest tests/test_date_resolution.py -v --tb=short || echo "Some tests may fail without full deps"
