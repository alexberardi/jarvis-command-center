name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Create data directory
      run: mkdir -p data
    
    - name: Run SQLite tests
      env:
        DB_TYPE: sqlite
        DB_URL: sqlite:///./data/test.db
      run: |
        python -m pytest tests/ -v \
          --ignore=tests/test_llm_integration.py \
          -k "not llm" \
          --tb=short \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing
    
    - name: Run PostgreSQL tests
      env:
        DB_TYPE: postgres
        DB_URL: postgresql://test_user:test_password@localhost:5432/test_db
        TEST_POSTGRES: 1
      run: |
        python -m pytest tests/test_postgres_integration.py -v \
          --tb=short \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing
    
    - name: Run database configuration tests
      env:
        DB_TYPE: sqlite
        DB_URL: sqlite:///:memory:
      run: |
        python -m pytest tests/test_database_config.py -v \
          --tb=short \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false 