name: Core Tests (SQLite Only)

on:
  push:
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Create data directory
      run: mkdir -p data
    
    - name: Run core tests (SQLite only)
      env:
        DB_TYPE: sqlite
        DB_URL: sqlite:///./data/test.db
      run: |
        python -m pytest tests/ -v \
          --ignore=tests/test_llm_integration.py \
          --ignore=tests/test_postgres_integration.py \
          -k "not llm" \
          --tb=short \
          --cov=app \
          --cov-report=term-missing
    
    - name: Run database tests
      env:
        DB_TYPE: sqlite
        DB_URL: "sqlite:///:memory:"
      run: |
        python run_database_tests.py --type sqlite
