name: Integration Trigger

# Fires a repository_dispatch at jarvis-node-setup when a PR opens or is
# updated here. The receiver workflow (jarvis-node-setup/.github/workflows/
# integration-runner.yml) runs the cross-service integration suite against
# the PR's HEAD SHA and posts results back as a PR comment + check-run.
#
# Required secret:
#   INTEGRATION_DISPATCH_TOKEN — fine-grained PAT scoped to
#                                  `repository_dispatch:write` on
#                                  alexberardi/jarvis-node-setup only.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Dispatch integration run
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ORIGINATING_REPO: ${{ github.repository }}
        run: |
          # linked_prs is a JSON-encoded map of cross-service PR dependencies,
          # e.g. {"jarvis-llm-proxy-api": "coding-agent/issue-12-streaming"}.
          # Empty {} default → the runner uses ghcr.io :dev images for the rest
          # of the stack. The trigger plumbs this through but doesn't set it
          # itself; multi-repo coding-agent runs can pass it explicitly via
          # the workflow_dispatch path or by forking this trigger and adding
          # logic to read it from the PR body / issue.
          gh api \
            --method POST \
            /repos/alexberardi/jarvis-node-setup/dispatches \
            -f "event_type=pr-integration" \
            -f "client_payload[service]=jarvis-command-center" \
            -f "client_payload[pr_number]=$PR_NUMBER" \
            -f "client_payload[head_sha]=$HEAD_SHA" \
            -f "client_payload[head_ref]=$HEAD_REF" \
            -f "client_payload[originating_repo]=$ORIGINATING_REPO" \
            -f "client_payload[qa_plan_comment_id]=" \
            -f "client_payload[linked_prs]={}"
