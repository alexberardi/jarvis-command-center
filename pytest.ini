[tool:pytest]
# Test markers
markers =
    postgres: marks tests as PostgreSQL database tests
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow running tests
    llm: marks tests as LLM integration tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude LLM integration tests by default (they require external services)
norecursedirs =
    tests/test_llm_integration.py

# Output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -k "not llm"  # Exclude LLM tests by default

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Environment variables for PostgreSQL tests
env =
    DATABASE_URL = postgresql://jarvis_user:jarvis_password@localhost:5433/jarvis_command_center
