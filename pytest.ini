[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --no-cov
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests as database tests
    llm: marks tests as LLM integration tests

# Run tests in single thread to avoid SQLite threading issues
# Uncomment the line below if you still have threading issues
# addopts = -v --tb=short --disable-warnings -x -n0 