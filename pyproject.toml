[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-command-center"
version = "0.1.0"
description = "Central voice command API for the Jarvis ecosystem"
requires-python = ">=3.11"
dependencies = [
    "jarvis-config-client @ git+https://github.com/alexberardi/jarvis-config-client.git@c1c8903",
    "jarvis-log-client @ git+https://github.com/alexberardi/jarvis-log-client.git@3c7da7e",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "watchdog",
    "python-dotenv",
    "httpx",
    "websockets",
    "debugpy",
    "rapidfuzz",
    "psycopg2-binary",
    "pgvector>=0.3.0",
    "pytz",
    "fasttext",
    "numpy<2",
    "paho-mqtt",
    "cryptography",
    "feedparser",
    "jarvis-settings-client @ git+https://github.com/alexberardi/jarvis-settings-client.git@9902feb",
    "jarvis-auth-client @ git+https://github.com/alexberardi/jarvis-auth-client.git@4549b23",
    "ddgs>=7.0.0",
    "jarvis-web-scraper @ git+https://github.com/alexberardi/jarvis-web-scraper.git@60ac1bf",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
