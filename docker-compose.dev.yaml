services:
  jarvis-voice-api:
    build: .
    ports:
      - "${PORT:-8002}:8002"
      - "${DEBUG_PORT:-5678}:${DEBUG_PORT:-5678}"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./temp:/app/temp
      - ./.env:/app/.env
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ../jarvis-log-client:/app/jarvis-log-client
      - ../jarvis-config-client:/app/jarvis-config-client
      - ../jarvis-settings-client:/app/jarvis-settings-client
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-true}
      - DEBUG_PORT=${DEBUG_PORT:-5678}
      # Use DB_URL from .env (central postgres)
      - DATABASE_URL=${DB_URL}
      - JARVIS_CONFIG_URL_STYLE=dockerized
    extra_hosts:
      - "${DOCKER_HOST_ALIAS:-host.docker.internal}:host-gateway"
    command: >
      sh -c "pip install -q -e /app/jarvis-log-client -e /app/jarvis-config-client -e /app/jarvis-settings-client &&
             alembic upgrade head &&
             python -Xfrozen_modules=off -m uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"
