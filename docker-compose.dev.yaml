version: '3.9'

services:
  jarvis-voice-api:
    build: .
    ports:
      - "9998:9998"
      - "5678:5678"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./.env:/app/.env
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-Xfrozen_modules=off", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9998", "--reload"]
