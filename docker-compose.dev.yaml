version: '3.9'

services:
  jarvis-voice-api:
    build: .
    ports:
      - "8002:8002"
      - "${DEBUG_PORT:-5678}:${DEBUG_PORT:-5678}"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./temp:/app/temp
      - ./.env:/app/.env
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
      - DEBUG_PORT=${DEBUG_PORT:-5678}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-Xfrozen_modules=off", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
